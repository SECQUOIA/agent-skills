name: Skill Merge Scanner

on:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Optional branch, tag, or commit SHA to scan before merging"
        required: false
        type: string

permissions:
  contents: read

jobs:
  nvidia-skill-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref || github.ref }}
      - name: Provision NVIDIA SkillEvaluator and pinned SkillSpector
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/nvidia-scanner"
          "$RUNNER_TEMP/nvidia-scanner/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nvidia-scanner/bin/python" -m pip install \
            "skillevaluator==0.9.0" \
            "bandit==1.9.4" \
            "ruff==0.17.5"
          WHEEL="$RUNNER_TEMP/skillspector-2.13.4-py3-none-any.whl"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.4/skillspector-2.13.4-py3-none-any.whl" \
            -o "$WHEEL"
          printf '%s  %s\n' \
            "c5e7f290897c65018013a6e37022fabdd2ba1aeeb4994b65df2de8b0d536bea0" \
            "$WHEEL" | sha256sum -c -
          "$RUNNER_TEMP/nvidia-scanner/bin/python" -m pip install "$WHEEL"
      - name: Verify Tier 1 scanner readiness
        run: |
          export PATH="$RUNNER_TEMP/nvidia-scanner/bin:$PATH"
          skillevaluator doctor --tier 1
      - name: Run merge-time NVIDIA skill scan across public skills
        run: |
          export PATH="$RUNNER_TEMP/nvidia-scanner/bin:$PATH"
          "$RUNNER_TEMP/nvidia-scanner/bin/python" -B scripts/run_skill_scanner.py \
            --output-dir "$RUNNER_TEMP/skill-scan-reports"
